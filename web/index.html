<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港入境处预约配额看板</title>
<link rel="stylesheet" href="style.css?v=3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
</head>
<body>
<div class="container">
  <header>
    <h1>香港入境處預約配額一覽</h1>
    <p class="subtitle">換領身份證 · 各人事登記辦事處</p>
    <div class="meta">
      <span id="updateTime">載入中...</span>
      <span class="legend">
        <span class="dot green"></span> 有名額
        <span class="dot yellow"></span> 少量
        <span class="dot red"></span> 已滿
        <span class="dot gray"></span> 不提供
      </span>
    </div>
    <div class="header-links">
      <a href="https://www.gov.hk/sc/apps/immdicbooking2.htm" class="btn btn-link" target="_blank" rel="noopener">📋 網上預約申領身份證</a>
      <a href="https://system.es2.immd.gov.hk/smartics2-client/ropbooking/zh-CN/eservices/ropPrefillForm/term?svcId=680&ticketId=680-d7dee587-4de3-4075-a05a-15439620a274" class="btn btn-link" target="_blank" rel="noopener">✏️ 預填表格（已預約人士）</a>
    </div>
  </header>

  <div class="tab-row">
    <button class="tab-btn active" id="tabQuota">📊 实时配额</button>
    <button class="tab-btn" id="tabTrend">📈 放号规律</button>
  </div>

  <div id="viewQuota">

  <div class="feishu-cta" id="feishuCta">
    <div class="feishu-cta-inner">
      <span class="feishu-cta-icon">💬</span>
      <div class="feishu-cta-text">
        <strong>飞书订阅通知</strong>
        <span>入群（消息秒达）或私聊机器人按日期过滤</span>
      </div>
      <a href="https://scn7uo58gnuo.feishu.cn/wiki/QSFlwcMBmil7sGkZRBTcAWqwnCf" target="_blank" rel="noopener" class="btn btn-feishu">📖 加群方式</a>
      <a href="https://applink.feishu.cn/T98uc8RbxI8c" target="_blank" rel="noopener" class="btn btn-feishu-outline">💬 私聊机器人</a>
    </div>
  </div>

  <div class="toolbar">
    <span id="dateRange" class="date-range"></span>
  </div>

  <div id="loading" class="loading">載入配額數據中...</div>
  <div id="error" class="error hidden"></div>

  <div class="table-wrapper">
    <table id="quotaTable" class="hidden">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<div id="viewTrend" class="hidden">

  <div class="kpi-row">
    <div class="kpi-card" id="tcCountdown"><div class="kpi-label">⏱️ 上次放号时间</div><div class="kpi-big" id="tcVal">--</div></div>
    <div class="kpi-card">
      <div class="kpi-label">🔥 高频放号 TOP 3</div>
      <ul class="top3" id="top3List"><li style="color:var(--text2)">暂无数据</li></ul>
    </div>
  </div>

  <div class="sec-row">
    <h2>📊 放号热力图</h2>
    <div class="pills">
      <button class="pill on" data-period="7">7 天</button>
      <button class="pill" data-period="14">14 天</button>
    </div>
  </div>

  <div class="tm-wrap">
  <table class="tm-grid">
    <thead id="tmHead"></thead>
    <tbody id="tmBody"></tbody>
  </table>
  </div>

  <div class="leg">
    <span>少</span><span class="sw v0"></span><span class="sw v1"></span><span class="sw v2"></span><span class="sw v3"></span><span class="sw v4"></span><span class="sw v5"></span><span>多</span>
    <span style="margin-left:12px">格内数字 = 该小时放出日期总数</span>
  </div>

</div>

</div>

<script src="app.js?v=3"></script>
</body>
</html>
